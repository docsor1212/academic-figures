[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-figures-mcp"
version = "1.0.0"
description = "academic-figures MCP server — 40 publication-grade academic chart types via FastMCP (local render, deterministic, zero-key)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SorSor" }]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.21",
    "scipy>=1.7",
    "pymupdf>=1.20",
    "fastmcp>=2.0",
]

[project.scripts]
academic-figures-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
# af_engine 嵌入副本不随 MCP 子目录分发（引擎随 skill 包根 scripts/ 提供；
# 开发形态先跑 mcp/sync_engine.sh 生成本地镜像）。独立安装本 MCP 时引擎经
# server.py 的 ../scripts 回退解析——wheel 不含引擎属如实声明。
packages = []

[tool.setuptools.package-data]
af_engine = ["journal/*.json", "changelog.md"]
